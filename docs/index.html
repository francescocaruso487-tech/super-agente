<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rassegna</title>
<meta name="theme-color" content="#1d4fb8">
<meta name="description" content="La tua rassegna di notizie, norme e novità">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=48">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" width="34" height="34">
    <div>
      <h1>Rassegna</h1>
      <p id="aggiornato" class="sub">Caricamento…</p>
    </div>
  </div>
  <div class="top-az"><button id="btn-tema" class="icon-btn" aria-label="Colori e tema">🎨</button><button id="btn-refresh" class="icon-btn" aria-label="Aggiorna">⟳</button></div>
</header>

<main>
  <button id="btn-oggi" class="oggi-box" hidden><span>Oggi</span><i>–</i><b id="oggi-data"></b></button>
  <div id="nicchie" class="nicchie" role="tablist"><button data-n="edilizia" class="on"><i>👤</i><span>Professioni</span></button><button data-n="tech"><i>📱</i><span>Tecnologia</span></button><button data-n="politica"><i>🏛️</i><span>Politica</span></button><button data-n="auto"><i>🚗</i><span>Motori</span></button></div>
  <div id="prof-bar" class="profbar" hidden></div>
  <section id="tab-novita" class="tab active">
    <label class="switch" id="solo-norm-label"><input type="checkbox" id="solo-norm"><span>Solo novità normative</span></label>
    <div id="lista-novita" class="lista"></div>
  </section>

  <section id="tab-archivio" class="tab">
    <input id="cerca" type="search" placeholder="Cerca nell'archivio (es. CILA, DM 37/08, Docfa)" autocomplete="off">
    <div class="chips" id="chips-archivio" role="tablist" aria-label="Aree archivio"></div>
    <div id="lista-archivio" class="lista"></div>
    <button id="piu" class="more" hidden>Mostra altre</button>
  </section>

  <section id="tab-link" class="tab">
    <input id="cerca-link" type="search" placeholder="Cerca un link (es. catasto, INPS, norme)" autocomplete="off">
    <div id="lista-link"></div>
  </section>

  <section id="tab-fonti" class="tab">
    <div id="fonti-riepilogo" class="riepilogo"></div>
    <div id="lista-fonti"></div>
  </section>
</main>

<nav class="bottom" aria-label="Sezioni">
  <button data-tab="novita" class="on"><span><svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><rect class="f" x="5" y="9" width="20" height="17" rx="5"/><path d="M9 5.5h12" /><path d="M10.5 15.5h9M10.5 20h5.5"/><path class="sp" d="M25.5 3.5l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z"/></svg></span>Novità</button>
  <button data-tab="archivio"><span><svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><rect class="f" x="4.5" y="7" width="19" height="17" rx="5"/><path d="M8.5 12.5h11"/><circle class="f" cx="21" cy="21" r="5.2"/><path d="M25 25l3.2 3.2"/></svg></span>Archivio</button>
  <button data-tab="link"><span><svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><rect class="f" x="3.5" y="11.5" width="14" height="9" rx="4.5" transform="rotate(-35 10.5 16)"/><rect class="f" x="14.5" y="11.5" width="14" height="9" rx="4.5" transform="rotate(-35 21.5 16)"/><path d="M12.5 19.5l7-7"/></svg></span>Link</button>
  <button data-tab="fonti"><span><svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><circle class="f" cx="16" cy="16" r="3.2"/><path d="M9.8 9.8a8.8 8.8 0 000 12.4M22.2 9.8a8.8 8.8 0 010 12.4"/><path d="M5.6 5.6a14.8 14.8 0 000 20.8M26.4 5.6a14.8 14.8 0 010 20.8"/></svg></span>Fonti</button>
</nav>


<div id="alm" class="alm" hidden><div class="alm-top"><button class="alm-back" data-alm-back aria-label="Indietro">←</button><b id="alm-tit">Oggi</b></div><div id="alm-corpo" class="alm-corpo"></div></div>

<div id="tema-sheet" class="sheet" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet-box" role="dialog" aria-label="Colori e tema">
    <div class="sheet-grip"></div>
    <h2>Colori e tema</h2>
    <p class="sw-t">Tema</p><div class="sw-mode seg"></div>
    <p class="sw-t">Colore</p><div class="sw-col"></div>
    <label class="sw-sfondo">🖼️ Prendi i colori dal mio sfondo<input id="tema-file" type="file" accept="image/*" hidden></label>
    <p class="sw-nota">Scegli uno screenshot o la foto del tuo sfondo: l'app ne ricava i colori, come i colori dinamici di Android.</p>
    <button class="sheet-x">Fatto</button>
  </div>
</div>
<script src="theme.js?v=48"></script>
<script src="app.js?v=48"></script>
<script src="link.js?v=48"></script>
</body>
</html>
