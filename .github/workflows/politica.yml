name: Aggiorna quadro politico
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: politica
  cancel-in-progress: false
jobs:
  politica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leggi le fonti ufficiali
        continue-on-error: true
        run: python scripts/politica.py --forza
      - name: Salva i dati
        run: |
          git config user.name "rassegna-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aggiornamento quadro politico"
          git pull --rebase -X theirs origin main
          git push
