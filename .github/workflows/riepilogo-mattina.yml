name: Riepilogo del mattino

on:
  schedule:
    - cron: "30 6 * * *"   # 07:30 ora italiana (inverno), 08:30 (estate)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  riepilogo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py --digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salva data ultimo riepilogo
        run: |
          git config user.name "super-agente-bot"
          git config user.email "super-agente-bot@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Riepilogo inviato"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
