name: Riepilogo del mattino

on:
  schedule:
    - cron: "30 6 * * *"   # 07:30 ora italiana (inverno), 08:30 (estate)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riepilogo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py --digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
