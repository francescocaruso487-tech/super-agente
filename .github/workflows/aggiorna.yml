name: Aggiorna notizie

on:
  schedule:
    # GitHub non garantisce l'orario preciso dei lavori programmati: ne metto tre per ora,
    # così almeno uno parte (chi arriva dopo trova i dati già aggiornati)
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leggi le fonti
        run: python scripts/fetch.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Aggiorna il quadro politico (fonti ufficiali)
        continue-on-error: true
        run: python scripts/politica.py
      - name: Salva i dati
        run: |
          git config user.name "super-agente-bot"
          git config user.email "super-agente-bot@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento notizie"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
      - name: Invia le notifiche (solo novita' mai notificate)
        run: python scripts/fetch.py --invia-notifiche
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salva elenco notificate
        run: |
          git config user.name "super-agente-bot"
          git config user.email "super-agente-bot@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Elenco notifiche inviate"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
