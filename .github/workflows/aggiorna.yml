name: Aggiorna notizie

on:
  schedule:
    - cron: "7 * * * *"   # ogni ora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leggi le fonti
        run: python scripts/fetch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Salva i dati
        run: |
          git config user.name "super-agente-bot"
          git config user.email "super-agente-bot@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento notizie"
            git pull --rebase
            git push
          fi
