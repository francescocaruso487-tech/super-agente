name: Aggiorna atti ufficiali
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atti
  cancel-in-progress: false
jobs:
  atti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leggi Gazzetta Ufficiale
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/atti.py
      - name: Salva i dati
        run: |
          git config user.name "rassegna-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aggiornamento atti"
          git pull --rebase -X theirs origin main
          git push
